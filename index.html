<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Bazar de Nobsy | Neon Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP PILL RIBBON COMME TON SCREENSHOT -->
<div class="top-pills">
    <div class="pills-track">
        <button onclick="filterByCategory('xbox')">🎮 Xbox</button>
        <button onclick="filterByCategory('playstation')">🕹️ Playstation</button>
        <button onclick="filterByCategory('nintendo')">🍄 Nintendo</button>
        <button onclick="filterByCategory('console')">📦 Consoles</button>
        <button onclick="filterByCategory('pop')">🧸 Funko Pop</button>
        <button onclick="filterByCategory('film')">🎬 Films</button>
        <button onclick="filterByCategory('skylander')">🌀 Skylanders</button>
    </div>
</div>

<!-- NAVBAR COMME SCREENSHOT -->
<nav class="navbar-shot">
    <div class="logo-shot">LE BAZAR DE NOBSY</div>
    <div class="search-shot">
        <input type="search" id="searchProduct" placeholder="🔍 Rechercher..." oninput="searchProducts()">
    </div>
    <div class="hamburger-shot" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    <ul class="nav-menu" id="navMenu">
        <li><a href="#accueil">Accueil</a></li>
        <li><a href="#produits">Produits</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<!-- HERO CARTE ARRONDI COMME SCREENSHOT MAIS NEON -->
<header id="accueil" class="hero-shot">
    <div class="hero-card">
        <div class="hero-card-bg"></div>
        <div class="hero-card-content">
            <h1>Bienvenue au<br><span>Bazar de Nobsy</span></h1>
            <p>Les meilleurs deals retro gaming à Joliette, Québec<br><b style="color:#00f2ff;">ARCADE 3D EDITION - TOIT ROUGE</b></p>
            
            <button class="btn-blue" onclick="document.getElementById('produits').scrollIntoView({behavior:'smooth'})">Voir les produits</button>
            <button class="btn-white" onclick="window.open('https://www.facebook.com/share/g/18YTkXrkvB/')">Rejoindre le Live</button>
            <button class="btn-blue" onclick="window.open('https://ruinsnradz.servegame.com/')">Partenariat Ruins'n Radz</button>
        </div>
    </div>
</header>

<!-- PRODUITS -->
<section id="produits">
    <div class="container">
        <h2 class="section-title">INVENTAIRE NEON</h2>
        <div id="category-back-button" style="display:none; text-align:center; margin:20px;"><button class="btn-blue" onclick="showAllCategories()">← Retour catalogue</button></div>
        
        <div id="xbox"><h3 class="cat">🎮 XBOX</h3><div class="products-grid" id="grid-xbox"></div></div>
        <div id="playstation"><h3 class="cat">🕹️ PLAYSTATION</h3><div class="products-grid" id="grid-playstation"></div></div>
        <div id="nintendo"><h3 class="cat">🍄 NINTENDO</h3><div class="products-grid" id="grid-nintendo"></div></div>
        <div id="console"><h3 class="cat">📦 CONSOLES</h3><div class="products-grid" id="grid-console"></div></div>
        <div id="pop"><h3 class="cat">🧸 FUNKO POP</h3><div class="products-grid" id="grid-pop"></div></div>
        <div id="film"><h3 class="cat">🎬 FILMS</h3><div class="products-grid" id="grid-film"></div></div>
        <div id="skylander"><h3 class="cat">🌀 SKYLANDERS</h3><div class="products-grid" id="grid-skylander"></div></div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
